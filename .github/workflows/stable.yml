name: Stable Image

on:
  push:
    branches:
      - main
    paths:
      - 'stable.Dockerfile'
      - 'stable-extra.Dockerfile'
      - '.github/workflows/stable.yml'
    tags:
      - 'stable/*'
  workflow_dispatch:

concurrency:
  group: build-stable
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve:
    name: Resolve Version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve Version
        id: resolve
        run: |
          REF_NAME="${{ github.ref_name }}"
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF_NAME" = "main" ]; then
            VERSION="stable-latest"
          else
            VERSION="${REF_NAME#stable/}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.image }} for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        image: [base, extra]
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            arch: arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve tag and Dockerfile
        id: resolve
        run: |
          IMAGE=${{ matrix.image }}
          VERSION=${{ needs.resolve.outputs.version }}
          ARCH=${{ matrix.arch }}

          if [ "$IMAGE" = "base" ]; then
            DOCKERFILE="stable.Dockerfile"
            TAG="$VERSION-$ARCH"
          else
            DOCKERFILE="stable-$IMAGE.Dockerfile"
            TAG="$VERSION-$IMAGE-$ARCH"
          fi

          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve.outputs.tag }}

      - name: Build and Push Architecture Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.resolve.outputs.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.tag }}
          platforms: ${{ matrix.platform }}

  merge:
      name: Merge Images
      needs: [resolve, build]
      runs-on: ubuntu-26.04

      permissions:
        packages: write

      strategy:
        fail-fast: false
        matrix:
          image: [base, extra]

      steps:
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Resolve Images
          id: resolve
          run: |
            IMAGE=${{ matrix.image }}
            VERSION=${{ needs.resolve.outputs.version }}

            if [ "$IMAGE" = "base" ]; then
              TAG="$VERSION"
            else
              TAG="$VERSION-$IMAGE"
            fi

            echo "tag=$TAG" >> $GITHUB_OUTPUT

        - name: Log in to Container Registry
          uses: docker/login-action@v4
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Merge and Push
          run: |
            TAG="${{ needs.resolve.outputs.tag }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

            docker buildx imagetools create -t ${IMAGE}:${TAG} \
              ${IMAGE}:${TAG}-amd64 \
              ${IMAGE}:${TAG}-arm64
