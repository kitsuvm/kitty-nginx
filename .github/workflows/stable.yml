name: Stable Image

on:
  push:
    branches:
      - main
    paths:
      - 'stable.Dockerfile'
      - 'stable-extra.Dockerfile'
    tags:
      - 'stable/*'
  workflow_dispatch:

concurrency:
  group: build-stable
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-base:
    name: Build Base
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Tag Version
        id: resolve
        run: |
          REF_NAME="${{ github.ref_name }}"
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF_NAME" = "main" ]; then
            CLEAN_VERSION="stable-latest"
          else
            # Strips the 'stable/' prefix, leaving '1.30.1-20261008'
            CLEAN_VERSION="${REF_NAME#stable/}"
          fi

          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve.outputs.clean_version }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./stable.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  build-extra:
    name: Build Extra
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Tag Version
        id: resolve
        run: |
          REF_NAME="${{ github.ref_name }}"
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF_NAME" = "main" ]; then
            CLEAN_VERSION="stable-extra-latest"
          else
            # Strips the 'stable/' prefix, leaving '1.30.1-20261008'
            CLEAN_VERSION="${REF_NAME#stable/}-extra"
          fi

          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve.outputs.clean_version }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./stable-extra.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
